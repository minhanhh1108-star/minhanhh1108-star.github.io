<script>
/* ================= State & helpers ================= */
var S = { token: localStorage.getItem('lc_token') || '', user: null, settings: null, library: null, status: null,
          tab: 'orders', orders: [], live: [], log: [], users: [], order: null, check: null, open: {}, busy: false,
          libFilter: { acc: '', q: '' }, logFilter: '' };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { n = Math.round(Number(n) || 0); return n.toLocaleString('vi-VN'); }
function $(sel) { return document.querySelector(sel); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function toast(msg, err) {
  var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 6000 : 2500);
}

function call(action, payload) {
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(function (r) {
      if (r && r.ok) return resolve(r.data);
      var msg = (r && r.error) || 'Lỗi không xác định';
      if (msg.indexOf('AUTH:') === 0) { logoutLocal(); toast(msg.slice(5), true); return reject(new Error(msg)); }
      toast(msg, true); reject(new Error(msg));
    }).withFailureHandler(function (e) { toast(e.message || String(e), true); reject(e); })
      .api(action, S.token, payload || {});
  });
}

function logoutLocal() { S.token = ''; S.user = null; localStorage.removeItem('lc_token'); render(); }

function role(min) { var R = { content: 1, runner: 2, approver: 3, admin: 4 }; return S.user && R[S.user.role] >= R[min]; }
function acc(id) { return (S.settings.accounts || []).filter(function (a) { return a.id === id; })[0]; }
function regionName(k) { var r = S.settings.regions.filter(function (x) { return String(x.key) === String(k); })[0]; return r ? r.name : k; }
function statusBadge(st) {
  var m = { 'Đã xóa trên Meta': 'b-gray', 'Nháp': 'b-gray', 'Chờ QC': 'b-warn', 'Đã QC': 'b-ok', 'Chờ dựng': 'b-info', 'Đang dựng': 'b-info', 'Đã dựng (tạm dừng)': 'b-warn', 'Lỗi': 'b-bad', 'Đang chạy': 'b-ok', 'Tạm dừng': 'b-gray' };
  return '<span class="badge ' + (m[st] || 'b-gray') + '">' + esc(st) + '</span>';
}
function ageBadge(a) {
  if (a.ageDays == null) return '<span class="badge b-gray">không rõ ngày</span>';
  var lim = S.settings.limits.audienceMaxDays;
  return '<span class="badge ' + (a.ageDays > lim ? 'b-warn' : 'b-ok') + '">' + a.ageDays + ' ngày' + (a.ageDays > lim ? ' · cũ' : '') + '</span>';
}

/* ================= Boot ================= */
function boot() {
  if (!S.token) return render();
  call('bootstrap').then(function (d) {
    S.user = d.user; S.settings = d.settings; S.library = d.library; S.status = d.status; S.canQc = d.canQc;
    render(); loadTab();
  }).catch(function () { render(); });
}

function loadTab() {
  var t = S.tab;
  if (t === 'orders') return call('listOrders').then(function (d) { S.orders = d; render(); });
  if (t === 'live') return call('listLive').then(function (d) { S.live = d; render(); });
  if (t === 'log') return call('listLog', { orderId: S.logFilter }).then(function (d) { S.log = d; render(); });
  if (t === 'users') return call('listUsers').then(function (d) { S.users = d; render(); });
  render();
}

function go(tab) { S.tab = tab; render(); loadTab(); }

/* ================= Render root ================= */
var ICONS = {
  live: '<path d="M3 12h4l3-8 4 16 3-8h4"/>', orders: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',
  edit: '<path d="M12 5v14M5 12h14"/>', dash: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', library: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5"/>',
  log: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>', users: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.9V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
function icon(k) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[k] || '') + '</svg>'; }

function render() {
  var app = $('#app');
  if (!S.user) { app.innerHTML = viewLogin(); return; }
  var qcWait = S.canQc ? S.orders.filter(function (o) { return o.status === 'Chờ QC'; }).length : 0;
  var groups = [['Vận Hành', [['edit', S.order && S.order.id ? 'Sửa Camp' : '+ Lên Camp'], ['orders', 'Camp AI Lên', qcWait], ['live', 'Camp Đang Chạy']]],
                ['Phân Tích', [['dash', 'Báo Cáo'], ['library', 'Tệp & Form'], ['log', 'Lịch Sử']]]];
  if (role('admin')) groups.push(['Quản Trị', [['users', 'Team'], ['settings', 'Cài Đặt']]]);
  var nm = S.user.name || S.user.email;
  var html = '<div class="shell"><aside class="side"><div class="brand"><span class="logo">⚡</span><span>AI Agent Ads<small>Bot Bán Hàng · Meta Ads</small></span></div><nav class="menu">' +
    groups.map(function (g) {
      return '<div class="grp">' + g[0] + '</div>' + g[1].map(function (t) {
        var cls = (S.tab === t[0] ? 'active' : '') + (t[0] === 'edit' && !(S.order && S.order.id) && S.tab !== 'edit' && role('runner') ? ' cta' : '');
        if (t[0] === 'edit' && !role('runner') && !S.order) return '';
        return '<button data-act="tab" data-tab="' + t[0] + '" class="' + cls + '">' + icon(t[0]) + '<span>' + esc(t[1]) + '</span>' + (t[2] ? '<span class="cnt" title="Camp chờ bạn duyệt QC">' + t[2] + '</span>' : '') + '</button>';
      }).join('');
    }).join('') + '</nav>' +
    '<div class="who"><span class="ava">' + esc(String(nm).trim().charAt(0).toUpperCase()) + '</span><div><div class="nm">' + esc(nm) + '</div><div class="rl" style="color:#94a3b8">' + esc(S.user.roleLabel) + '</div>' +
    '<div><a data-act="pin">Đổi PIN</a> · <a data-act="logout">Thoát</a></div></div></div></aside><main>';
  var v = { dash: viewDashboard, live: viewLive, orders: viewOrders, edit: viewEditor, library: viewLibrary, log: viewLog, users: viewUsers, settings: viewSettings }[S.tab];
  html += v ? v() : '';
  app.innerHTML = html + '</main></div>';
}

/** Page header: title, optional subtitle and right-side actions. */
function pageHead(title, subtitle, actions) {
  return '<div class="ph"><div><h2>' + title + '</h2>' + (subtitle ? '<div class="sub2">' + subtitle + '</div>' : '') + '</div>' + (actions ? '<div class="bar right">' + actions + '</div>' : '') + '</div>';
}
function emptyState(title, text, action) { return '<div class="empty"><b>' + title + '</b>' + (text || '') + (action ? '<div style="margin-top:12px">' + action + '</div>' : '') + '</div>'; }
function seg(name, items, cur) {
  return '<div class="seg">' + items.map(function (it) {
    return '<button data-act="seg" data-seg="' + name + '" data-v="' + esc(it[0]) + '" class="' + (String(cur) === String(it[0]) ? 'on' : '') + '">' + esc(it[1]) + (it[2] != null ? '<span class="c">' + it[2] + '</span>' : '') + '</button>';
  }).join('') + '</div>';
}

function viewLogin() {
  return '<div class="center"><div class="card login"><div class="bd" style="border:0;padding:28px">' +
    '<div class="brand"><span class="logo" style="color:#fff">⚡</span><span>AI Agent Ads<small>Lên camp, QC và theo dõi Meta Ads cho team</small></span></div>' +
    '<div class="fld" style="margin-top:18px"><label>Email</label><input type="email" id="lg-email" autocomplete="username" placeholder="ban@gmail.com"></div>' +
    '<div class="fld" style="margin-top:12px"><label>Mã PIN</label><input type="password" id="lg-pin" inputmode="numeric" autocomplete="current-password" placeholder="••••••"></div>' +
    '<div style="margin-top:18px"><button class="btn p" data-act="login" style="width:100%;padding:10px">Đăng nhập</button></div>' +
    '<p class="muted" style="margin-top:14px">Chưa có tài khoản? Nhờ quản trị viên thêm bạn ở mục Team.</p></div></div></div>';
}

/* ================= Live ================= */
function viewLive() {
  var targetOf = function (name) {
    var low = name.toLowerCase();
    var hits = S.settings.industries.filter(function (i) {
      return [i.name].concat(i.keywords || []).some(function (k) { return k && low.indexOf(String(k).toLowerCase()) >= 0; }); });
    var ind = hits.length === 1 ? hits[0] : S.settings.industries.filter(function (i) { return i.name === 'Đa ngành'; })[0];
    return ind ? ind.target : null;
  };
  var upd = S.live[0] && S.live[0].updatedAt || '—';
  var h = pageHead('Camp Đang Chạy', 'Số liệu 7 ngày gần nhất · cập nhật ' + esc(upd), role('runner') ? '<button class="btn" data-act="syncLive">↻ Đồng bộ từ Meta</button>' : '');
  if (!S.live.length) return h + emptyState('Chưa có dữ liệu', 'Bấm "Đồng bộ từ Meta" để lấy danh sách camp đang chạy.');
  var F = S.liveF || (S.liveF = { acc: '', over: '' });
  var rows = S.live.map(function (c) {
    var cpl = c.leads ? c.spend / c.leads : null, tg = c.objective === 'OUTCOME_LEADS' ? targetOf(c.name) : null;
    return { c: c, cpl: cpl, tg: tg, over: c.objective === 'OUTCOME_LEADS' && c.spend > 0 && (cpl == null || (tg && cpl > tg)) };
  });
  var accs = []; S.live.forEach(function (c) { if (accs.indexOf(c.accountName) < 0) accs.push(c.accountName); });
  var vis = rows.filter(function (r) { return (!F.acc || r.c.accountName === F.acc) && (!F.over || r.over); });
  var sp = vis.reduce(function (s, r) { return s + r.c.spend; }, 0), ld = vis.reduce(function (s, r) { return s + r.c.leads; }, 0);
  var bud = vis.reduce(function (s, r) { return s + (r.c.dailyBudget || r.c.adsets.reduce(function (t, g) { return t + g.dailyBudget; }, 0)); }, 0);
  var nOver = vis.filter(function (r) { return r.over; }).length;
  h += '<div class="kpis"><div class="kpi"><div class="k">Chi tiêu 7 ngày</div><div class="v">' + money(sp) + 'đ</div><div class="h">' + vis.length + ' camp</div></div>' +
    '<div class="kpi"><div class="k">Ngân sách/ngày</div><div class="v">' + money(bud) + 'đ</div></div>' +
    '<div class="kpi"><div class="k">Lead</div><div class="v">' + money(ld) + '</div></div>' +
    '<div class="kpi"><div class="k">Chi phí/lead trung bình</div><div class="v">' + (ld ? money(sp / ld) + 'đ' : '—') + '</div></div>' +
    '<div class="kpi"><div class="k">Camp vượt mục tiêu</div><div class="v ' + (nOver ? 'bad' : 'ok') + '">' + nOver + '</div><div class="h">chi phí/lead cao hơn mục tiêu ngành</div></div></div>';
  h += '<div class="filters">' + seg('liveAcc', [['', 'Tất cả', rows.length]].concat(accs.map(function (a) { return [a, a, rows.filter(function (r) { return r.c.accountName === a; }).length]; })), F.acc) +
    seg('liveOver', [['', 'Mọi camp'], ['1', '⚠ Chỉ camp vượt mục tiêu']], F.over) + '</div>';
  if (!vis.length) return h + emptyState('Không có camp nào khớp bộ lọc', '');
  h += '<div class="tbl"><table class="tree"><tr><th>Chiến dịch ▸ nhóm • quảng cáo</th><th>Tài khoản</th><th class="n">Ngân sách/ngày</th><th class="n">Chi tiêu</th><th class="n">Lead</th><th class="n">Chi phí/lead</th><th class="n">Mục tiêu</th><th>Chi tiết</th><th></th></tr>';
  vis.map(function (r) { return r.c; }).forEach(function (c) {
    var cpl = c.leads ? c.spend / c.leads : null, tg = c.objective === 'OUTCOME_LEADS' ? targetOf(c.name) : null;
    var cls = cpl == null ? (c.spend > 0 && c.objective === 'OUTCOME_LEADS' ? 'b-bad' : 'b-gray') : (tg && cpl > tg ? 'b-bad' : 'b-ok');
    var open = S.open['live_' + c.id];
    var budget = c.dailyBudget || c.adsets.reduce(function (s, g) { return s + g.dailyBudget; }, 0);
    h += '<tr class="lvl1"><td><a data-act="toggle" data-key="live_' + c.id + '" style="cursor:pointer">' + (open ? '▾ ' : '▸ ') + esc(c.name) + '</a></td><td class="nw">' + esc(c.accountName) +
      '</td><td class="n">' + money(budget) + '</td><td class="n">' + money(c.spend) + '</td><td class="n">' + c.leads + '</td><td class="n"><span class="badge ' + cls + '">' +
      (cpl == null ? (c.objective === 'OUTCOME_LEADS' ? '0 lead' : 'Tương tác') : money(cpl)) + '</span></td><td class="n">' + (tg ? money(tg) : '') + '</td><td></td><td><div class="bar" style="flex-wrap:nowrap">' +
      (role('runner') ? '<button class="btn sm" data-act="cloneLive" data-id="' + c.id + '" title="Tạo camp mới từ camp này">Nhân bản</button>' : '') +
      (S.user.canActivate ? '<button class="btn sm danger" data-act="pauseLive" data-id="' + c.id + '" data-name="' + esc(c.name) + '">Tạm dừng</button>' : '') + '</div></td></tr>';
    if (!open) return;
    c.adsets.forEach(function (g) {
      var gcpl = g.leads ? money(g.spend / g.leads) : '';
      var tgt = [g.ageMin + '–' + g.ageMax, g.gender === 'all' ? 'Tất cả' : g.gender === 'male' ? 'Nam' : 'Nữ',
                 (g.regionKeys || []).map(regionName).join(', '), g.advantage ? 'Advantage+' : ''].filter(Boolean).join(' · ');
      h += '<tr class="lvl2"><td>▸ ' + esc(g.name) + '</td><td></td><td class="n">' + (g.dailyBudget ? money(g.dailyBudget) : '') + '</td><td class="n">' + money(g.spend) +
        '</td><td class="n">' + g.leads + '</td><td class="n">' + gcpl + '</td><td></td><td class="muted">' + esc(tgt) + '</td><td></td></tr>';
      g.ads.forEach(function (a) {
        h += '<tr class="lvl3"><td>• ' + esc(a.name) + '</td><td></td><td></td><td class="n">' + money(a.spend) + '</td><td class="n">' + a.leads + '</td><td class="n">' +
          (a.leads ? money(a.spend / a.leads) : '') + '</td><td></td><td class="muted">CTR ' + a.ctr.toFixed(2) + '% · tần suất ' + a.frequency.toFixed(2) + '</td><td></td></tr>';
      });
    });
  });
  return h + '</table></div>';
}

/* ================= Orders ================= */
function viewOrders() {
  var h = pageHead('Camp AI Lên', 'Mọi camp từ lúc nháp đến khi chạy. Trạng thái tự đồng bộ với Ads Manager mỗi giờ.',
    role('runner') ? '<button class="btn" data-act="syncOrders">↻ Đồng bộ từ Meta</button><button class="btn p" data-act="newOrder">+ Lên Camp Mới</button>' : '');
  if (!S.orders.length) return h + emptyState('Chưa có camp nào', 'Bắt đầu bằng "+ Lên Camp Mới", hoặc vào Camp Đang Chạy để nhân bản một camp đang hiệu quả.',
    role('runner') ? '<button class="btn p" data-act="newOrder">+ Lên Camp Mới</button>' : '');
  var groups = [['', 'Tất cả'], ['draft', 'Nháp / Lỗi', ['Nháp', 'Lỗi']], ['qc', 'Chờ QC', ['Chờ QC']], ['ready', 'Đã QC', ['Đã QC']],
                ['build', 'Đang dựng', ['Chờ dựng', 'Đang dựng']], ['built', 'Chờ bật', ['Đã dựng (tạm dừng)', 'Tạm dừng']], ['run', 'Đang chạy', ['Đang chạy']], ['gone', 'Đã xóa', ['Đã xóa trên Meta']]];
  var cnt = function (g) { return g[2] ? S.orders.filter(function (o) { return g[2].indexOf(o.status) >= 0; }).length : S.orders.length; };
  if (S.ordF === undefined) S.ordF = S.canQc && cnt(groups[2]) ? 'qc' : '';
  var cur = groups.filter(function (g) { return g[0] === S.ordF; })[0] || groups[0];
  if (cur[2] && !cnt(cur)) { S.ordF = ''; cur = groups[0]; }
  var q = (S.ordQ || '').toLowerCase();
  var list = S.orders.filter(function (o) { return (!cur[2] || cur[2].indexOf(o.status) >= 0) && (!q || (o.id + ' ' + o.name + ' ' + o.createdBy).toLowerCase().indexOf(q) >= 0); });
  h += '<div class="filters">' + seg('ord', groups.filter(function (g) { return !g[2] || cnt(g); }).map(function (g) { return [g[0], g[1], cnt(g)]; }), S.ordF) +
    '<input type="text" data-ordq placeholder="🔍 Tìm mã, tên camp, người tạo…" value="' + esc(S.ordQ || '') + '" style="max-width:280px;margin-left:auto"></div>';
  if (!list.length) return h + emptyState('Không có camp nào ở mục này', '');
  h += '<div class="tbl"><table><tr><th>Camp</th><th>Trạng thái</th><th class="n">Ngân sách/ngày</th><th class="n">Nhóm</th><th class="n">Số Ads</th><th>Người tạo</th><th>Cập nhật</th><th></th></tr>';
  list.forEach(function (o) {
    var b = [], main = '';
    if (o.status === 'Chờ QC' && S.canQc) main = '<button class="btn sm go" data-act="editOrder" data-id="' + o.id + '">Duyệt QC</button>';
    else if (['Đã dựng (tạm dừng)', 'Tạm dừng'].indexOf(o.status) >= 0 && S.user.canActivate) main = '<button class="btn sm go" data-act="activate" data-id="' + o.id + '" data-name="' + esc(o.name) + '">▶ Bật chạy</button>';
    else if (o.status === 'Lỗi' && role('runner')) main = '<button class="btn sm p" data-act="retry" data-id="' + o.id + '">Chạy lại</button>';
    else if (o.status === 'Đã QC' && role('runner')) main = '<button class="btn sm p" data-act="editOrder" data-id="' + o.id + '">Chốt camp</button>';
    if (!/Duyệt QC|Chốt camp/.test(main)) b.push('<button class="btn sm" data-act="editOrder" data-id="' + o.id + '">' + (['Nháp', 'Lỗi', 'Đã QC'].indexOf(o.status) >= 0 ? 'Sửa' : 'Xem') + '</button>');
    if (role('runner')) b.push('<button class="btn sm ghost" data-act="cloneOrder" data-id="' + o.id + '">Nhân bản</button>');
    if (o.status === 'Đang chạy' && S.user.canActivate) b.push('<button class="btn sm danger" data-act="pauseOrder" data-id="' + o.id + '">Tạm dừng</button>');
    b.push('<button class="btn sm ghost" data-act="orderLog" data-id="' + o.id + '">Lịch sử</button>');
    if (['Nháp', 'Lỗi', 'Đã QC'].indexOf(o.status) >= 0 && !o.campaignId && role('runner')) b.push('<button class="btn sm ghost" data-act="deleteOrder" data-id="' + o.id + '" style="color:var(--badT)">Xóa</button>');
    h += '<tr><td style="min-width:260px"><div style="font-weight:600">' + esc(o.name || '(chưa đặt tên)') + '</div><div class="muted">' + esc(o.id) + '</div>' +
      (o.error ? '<div class="muted" style="color:var(--badT)">⛔ ' + esc(o.error) + '</div>' : '') + (o.metaNote ? '<div class="muted" style="color:var(--warnT)">⚠ ' + esc(o.metaNote) + '</div>' : '') + qcLine(o) +
      '</td><td class="nw">' + statusBadge(o.status) + (o.status === 'Đang dựng' || o.status === 'Chờ dựng' ? ' <span class="spinner"></span>' : '') +
      '</td><td class="n">' + money(o.budget) + '</td><td class="n">' + o.adsets + '</td><td class="n">' + o.ads + '</td><td class="nw">' + esc(String(o.createdBy).split('@')[0]) +
      '</td><td class="nw muted">' + esc(String(o.updatedAt).replace('T', ' ').slice(5, 16)) + '</td><td><div class="bar" style="flex-wrap:nowrap;justify-content:flex-end">' + main + b.join('') + '</div></td></tr>';
  });
  h += '</table></div>';
  if (S.orders.some(function (o) { return o.status === 'Đang dựng' || o.status === 'Chờ dựng'; })) {
    clearTimeout(S.poll); S.poll = setTimeout(function () { if (S.tab === 'orders') loadTab(); }, 20000);
    h += '<p class="muted">Có camp đang dựng, trang tự cập nhật mỗi 20 giây.</p>';
  }
  return h;
}

/* ================= QC ================= */
var QC_DEC = { APPROVE: ['Đạt', 'b-ok'], REWRITE: ['Nên sửa', 'b-warn'], HUMAN_REVIEW: ['Cần người duyệt', 'b-warn'], REJECT: ['Từ chối', 'b-bad'] };
var QC_ICON = { GREEN: '✅', YELLOW: '🟡', ORANGE: '🟠', RED: '⛔', BLACK: '⛔' };
function qcBadge(q) { var d = QC_DEC[q.decision] || [q.decision, 'b-gray']; return '<span class="badge ' + d[1] + '">QC: ' + esc(d[0]) + ' · ' + q.score + 'đ</span>'; }
function qcLine(o) {
  if (!o.qc) return '';
  var n = o.qc.lastNote;
  return '<div style="margin-top:3px">' + qcBadge(o.qc) + (n && n.note ? ' <span class="muted">' + esc(n.decision) + ': ' + esc(n.note) + '</span>' : '') + '</div>';
}
function qcPanel(o) {
  var q = S.qc || (o.qc && o.qc.result);
  var h = '<div class="card" style="margin-top:12px"><div class="hd"><span class="ttl">Soát nội dung theo chính sách quảng cáo + quy tắc content</span>' + (q ? '<span class="right">' + qcBadge(q) + ' <span class="muted">rủi ro ' + esc(q.risk) + '</span></span>' : '') + '</div><div class="bd">';
  if (!q) return h + '<p class="muted">Bấm "Kiểm tra" để soát nội dung.</p></div></div>';
  if (!q.items.length) h += '<ul class="msgs"><li class="w" style="background:var(--ok);color:var(--okT)">✅ Không phát hiện vi phạm.</li></ul>';
  else h += '<ul class="msgs">' + q.items.map(function (x) {
    var cls = x.level === 'RED' || x.level === 'BLACK' ? 'e' : 'w';
    return '<li class="' + cls + '">' + (QC_ICON[x.level] || '') + ' <b>' + esc(x.level) + '</b> · ' + esc(x.where) + (x.excerpt ? ': "<b>' + esc(x.excerpt) + '</b>"' : '') +
      '<br>' + esc(x.msg) + (x.fix ? '<br><span style="color:#374151">→ Gợi ý: ' + esc(x.fix) + '</span>' : '') + ' <span class="muted">[' + esc(x.rule) + ' · ' + esc(x.src) + ']</span></li>';
  }).join('') + '</ul>';
  var canFix = editable() && q.items.some(function (x) { return x.replace; });
  if (canFix) h += '<button class="btn sm" data-act="qcFix" style="margin-top:6px">Sửa nhanh từ ngữ theo bảng quy đổi §21</button>';
  var notes = (o.qc && o.qc.notes) || [];
  if (notes.length) h += '<details style="margin-top:8px"' + (o.status === 'Nháp' ? ' open' : '') + '><summary>Lịch sử QC</summary><ul class="msgs">' + notes.slice().reverse().map(function (n) {
    return '<li class="w" style="background:#f8fafc;color:#374151">' + esc(n.at.replace('T', ' ')) + ' · <b>' + esc(n.decision) + '</b> bởi ' + esc(n.by) + (n.note ? ': ' + esc(n.note) : '') + '</li>'; }).join('') + '</ul></details>';
  if (o.status === 'Chờ QC' && S.canQc) {
    h += '<div style="margin-top:10px"><textarea id="qc-note" placeholder="Ghi chú QC (bắt buộc khi trả về, hoặc khi duyệt camp có mục 🟠)" style="min-height:60px"></textarea>' +
      '<div class="bar" style="margin-top:6px"><button class="btn go" data-act="qcApprove">✓ Duyệt QC</button><button class="btn danger" data-act="qcReturn">✗ Trả về sửa</button></div></div>';
  }
  return h + '</div></div>';
}

/* ================= Editor ================= */

function blankOrder() {
  var d = S.settings.defaults, a0 = S.settings.accounts[0];
  return { id: '', status: 'Nháp', campaign: { name: '', account: a0 ? a0.id : '', region: '3984', budgetMode: 'campaign', dailyBudget: '', testVar: '', note: '' },
           adsets: [newAdset(1)], ads: [newAd(1)] };
}
function newAdset(n) {
  var d = S.settings.defaults;
  return { key: 'g' + Date.now().toString(36) + n, name: '', audiences: [], excludes: [], audNote: '', excNote: '', ageMin: d.ageMin, ageMax: d.ageMax,
           gender: 'all', regions: [], regionNote: '', interests: [], behaviors: [], detailNote: '', advantage: false, geoExpand: false, dailyBudget: '', start: '', end: '', slots: [], days: [], slotNote: '' };
}
function newAd(n) {
  return { key: 'a' + Date.now().toString(36) + n, name: '', runIn: ['all'], source: 'drive', driveUrl: '', thumbUrl: '', postId: '', message: '', title: '', formId: '', note: '' };
}

function lockedCD() { return !role('runner') || !editable(); }
function editable() { return !S.order.status || ['Nháp', 'Lỗi', 'Đã QC'].indexOf(S.order.status) >= 0; }
function dis(locked) { return locked ? ' disabled' : ''; }

function chip(path, value, label, on, type, locked, extra) {
  return '<label class="chip' + (on ? ' on' : '') + (locked ? ' dis' : '') + '"><input type="' + type + '" data-' + (type === 'radio' ? 'radio' : 'multi') + '="' + path +
    '" value="' + esc(value) + '"' + (on ? ' checked' : '') + dis(locked) + (extra || '') + '>' + esc(label) + '</label>';
}

function viewEditor() {
  if (!S.order) { if (!role('runner')) return pageHead('Lên Camp') + emptyState('Chọn một camp để điền nội dung', 'Vào "Camp AI Lên", bấm Sửa ở camp được giao để điền phần ③ Quảng cáo.'); S.order = blankOrder(); }
  var o = S.order, c = o.campaign, L = lockedCD();
  var title = o.id ? esc(c.name || 'Camp ' + o.id) + ' ' + statusBadge(o.status) : 'Lên Camp Mới';
  var sub = o.id ? esc(o.id) + (o.clonedFrom ? ' · nhân bản từ ' + esc(o.clonedFrom) : '') + (S.dirty ? ' · <b style="color:var(--warnT)">chưa lưu</b>' : '') : 'Điền 4 bước. App tự lưu khi bạn bấm Lưu nháp, Gửi QC hoặc Chốt camp.';
  var h = pageHead(title, sub, '<button class="btn sm ghost" data-act="expandAll">Mở tất cả</button><button class="btn sm ghost" data-act="collapseAll">Thu gọn</button>');
  h += stepper(o);
  if (o.status === 'Chờ QC') h += note('info', 'Camp đang chờ QC, chỉ xem.' + (S.canQc ? ' Duyệt hoặc trả về ở mục ④.' : ''));
  else if (o.status === 'Đã QC') h += note('ok', 'Camp đã qua QC. Bấm "Chốt camp" để AI dựng trên Meta. Nếu sửa và lưu, camp quay về Nháp và phải QC lại.');
  else if (!editable()) h += note('info', 'Camp đã chốt, chỉ xem. Muốn thay đổi hãy "Nhân bản" thành camp mới.');
  else if (o.qc && o.qc.notes && o.qc.notes.length && o.qc.notes[o.qc.notes.length - 1].decision === 'Trả về')
    h += note('warn', 'QC trả về: ' + esc(o.qc.notes[o.qc.notes.length - 1].note) + '. Sửa xong bấm Gửi QC lại.');
  h += sectionCampaign(o, L) + sectionAdsets(o, L) + sectionAds(o) + sectionReview(o) + actionBar(o);
  return h;
}

function note(kind, html) {
  var m = { info: ['var(--info)', 'var(--blue)'], ok: ['var(--ok)', 'var(--okT)'], warn: ['var(--warn)', 'var(--warnT)'] }[kind];
  return '<div style="background:' + m[0] + ';color:' + m[1] + ';padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px">' + html + '</div>';
}

function orderBudget(o) {
  return o.campaign.budgetMode === 'campaign' ? Number(o.campaign.dailyBudget) || 0 : o.adsets.reduce(function (s, g) { return s + (Number(g.dailyBudget) || 0); }, 0);
}

function stepper(o) {
  var c = S.check, steps = [['cd', 'Chiến dịch', /^Chiến dịch/], ['nqc', 'Nhóm quảng cáo', /^Nhóm/], ['qc', 'Quảng cáo', /^Quảng cáo/], ['rv', 'Kiểm tra & QC']];
  return '<div class="steps">' + steps.map(function (st, i) {
    var cls = '';
    if (c && st[2]) cls = c.errors.some(function (e) { return st[2].test(e.msg); }) ? 'err' : 'ok';
    if (st[0] === 'rv' && c) cls = c.errors.length || (S.qc && S.qc.decision === 'REJECT') ? 'err' : (S.qc ? 'ok' : '');
    if (st[0] === 'rv' && ['Đã QC', 'Chờ dựng', 'Đang dựng', 'Đã dựng (tạm dừng)', 'Đang chạy', 'Tạm dừng'].indexOf(o.status) >= 0) cls = 'ok';
    return '<span class="step ' + cls + '" data-act="jump" data-key="' + st[0] + '"><span class="n">' + (cls === 'ok' ? '✓' : cls === 'err' ? '!' : i + 1) + '</span>' + st[1] + '</span>';
  }).join('') + '</div>';
}

function actionBar(o) {
  var c = S.check;
  var btns = '<button class="btn" data-act="check">Kiểm tra</button>' +
    (editable() ? '<button class="btn" data-act="save">Lưu nháp</button>' : '') +
    ((o.status !== 'Đã QC' || S.dirty) && editable() && role('runner') ? '<button class="btn go" data-act="sendQc"' + (c && !c.errors.length && !(S.qc && S.qc.decision === 'REJECT') ? '' : ' disabled title="Bấm Kiểm tra, sửa hết lỗi ⛔ trước"') + '>Gửi QC ▶</button>' : '') +
    (o.status === 'Đã QC' && !S.dirty && role('runner') ? '<button class="btn go" data-act="submit"' + (c && !c.errors.length ? '' : ' disabled title="Bấm Kiểm tra trước"') + '>Chốt camp ▶ AI dựng trên Meta</button>' : '');
  var hint = !c && editable() ? '<span class="muted">Bấm Kiểm tra để soát cấu hình và nội dung.</span>' :
    c && c.errors.length ? '<span class="badge b-bad">' + c.errors.length + ' lỗi cần sửa</span>' : c ? '<span class="badge b-ok">Cấu hình OK</span>' + (S.qc ? ' ' + qcBadge(S.qc) : '') : '';
  return '<div class="actbar"><div class="info"><span>Nhóm <b>' + o.adsets.length + '</b></span><span>Mẫu Ads <b>' + o.ads.length + '</b></span><span>Ngân sách <b>' + money(orderBudget(o)) + 'đ</b>/ngày</span>' + hint + '</div>' +
    '<div class="bar right">' + btns + '</div></div>';
}

function card(key, cls, title, summary, body, defaultOpen) {
  var open = S.open[key] !== undefined ? S.open[key] : defaultOpen;
  return '<div id="sec-' + key + '" class="card ' + cls + (open ? '' : ' collapsed') + '"><div class="hd" data-act="toggle" data-key="' + key + '"><span class="caret">▼</span><span class="ttl">' + title +
    '</span><span class="sum">' + (open ? '' : esc(summary)) + '</span></div>' + (open ? '<div class="bd">' + body + '<div class="bar" style="margin-top:12px"><button class="btn sm right" data-act="done" data-key="' + key + '">Xong ▲</button></div></div>' : '') + '</div>';
}

function sectionCampaign(o, L) {
  var c = o.campaign, a = acc(c.account);
  var sum = [c.name || '(chưa đặt tên)', a ? a.name : '', regionName(c.region),
             c.budgetMode === 'campaign' ? money(c.dailyBudget) + 'đ/ngày cấp chiến dịch' : 'ngân sách theo nhóm', c.testVar ? 'test ' + c.testVar : ''].filter(Boolean).join(' · ');
  var b = '<div class="row"><div class="fld"><label>Tên chiến dịch *</label><input type="text" data-bind="campaign.name" value="' + esc(c.name) + '"' + dis(L) + ' placeholder="Video | Spa | Mới | HCM | 600k | 20.11"></div></div>';
  b += '<div class="row"><div class="fld"><span class="lbl">Tài khoản *</span><div class="chips">' + S.settings.accounts.map(function (x) {
    return chip('campaign.account', x.id, x.name + ' · ' + x.pageName, c.account === x.id, 'radio', L, ' data-rerender="1"'); }).join('') + '</div></div></div>';
  b += '<div class="row"><div class="fld"><span class="lbl">Khu vực mặc định cho các nhóm *</span><div class="chips">' + S.settings.regions.map(function (x) {
    return chip('campaign.region', x.key, x.name, String(c.region) === String(x.key), 'radio', L); }).join('') + '</div></div></div>';
  b += '<div class="row"><div class="fld"><span class="lbl">Ngân sách đặt ở *</span><div class="chips">' +
    chip('campaign.budgetMode', 'campaign', 'Chiến dịch (Meta tự chia cho các nhóm)', c.budgetMode === 'campaign', 'radio', L, ' data-rerender="1"') +
    chip('campaign.budgetMode', 'adset', 'Từng nhóm', c.budgetMode === 'adset', 'radio', L, ' data-rerender="1"') + '</div></div>' +
    (c.budgetMode === 'campaign' ? '<div class="fld s"><label>Ngân sách/ngày (đ)</label><input type="number" step="10000" data-bind="campaign.dailyBudget" value="' + esc(c.dailyBudget) + '"' + dis(L) + '></div>' : '') + '</div>';
  b += '<div class="row"><div class="fld"><span class="lbl">Biến thử nghiệm</span><div class="chips">' +
    ['Tệp đối tượng', 'Creative', 'Khu vực', 'Ưu đãi', 'Ngân sách', 'Biểu mẫu', 'Nhân bản', 'Không'].map(function (x) {
      return chip('campaign.testVar', x, x, c.testVar === x, 'radio', L); }).join('') + '</div></div></div>';
  b += '<div class="row"><div class="fld"><label>Ghi chú</label><textarea data-bind="campaign.note"' + dis(L) + '>' + esc(c.note) + '</textarea></div></div>';
  return card('cd', 'sec', '① Chiến dịch', sum, b, true);
}

function audList(path, selected, account, kindFilter, L, searchKey) {
  var a = acc(account), pref = a ? a.audPrefix + '-' : '';
  var q = (S.open[searchKey] || '').toLowerCase();
  var items = S.library.audiences.filter(function (x) {
    return x.account === account && (!kindFilter || kindFilter(x)) && (!q || (x.code + ' ' + x.desc).toLowerCase().indexOf(q) >= 0);
  });
  items.sort(function (x, y) { return (selected.indexOf(y.code) >= 0) - (selected.indexOf(x.code) >= 0); });
  return '<input type="text" placeholder="🔍 Tìm tệp…" data-search="' + searchKey + '" value="' + esc(S.open[searchKey] || '') + '" style="margin-bottom:6px">' +
    '<div class="list">' + (items.length ? items.map(function (x) {
      var on = selected.indexOf(x.code) >= 0;
      return '<label class="li' + (on ? ' on' : '') + '"><input type="checkbox" data-multi="' + path + '" value="' + esc(x.code) + '"' + (on ? ' checked' : '') + dis(L) +
        '><div style="flex:1"><div class="code">' + esc(x.code) + ' ' + ageBadge(x) + '</div><div class="desc">' + esc(x.desc) + ' · ' + x.count + ' tệp</div></div></label>';
    }).join('') : '<div class="li muted">Không có tệp phù hợp (tệp của tài khoản ' + esc(pref) + ').</div>') + '</div>';
}

/** Detailed targeting: interests (search Meta) + behaviors (Meta list). Selected items are combined with OR. */
function detailTargeting(g, i, L) {
  g.interests = g.interests || []; g.behaviors = g.behaviors || [];
  var kq = 'ti_' + g.key, res = S.open['tres_' + g.key] || [], bq = (S.open['tb_' + g.key] || '').toLowerCase();
  var picked = g.interests.map(function (x) { return ['interests', x]; }).concat(g.behaviors.map(function (x) { return ['behaviors', x]; }));
  var size = function (n) { return n ? (n >= 1e6 ? (n / 1e6).toFixed(1) + ' tr' : Math.round(n / 1e3) + 'k') + ' người' : ''; };
  var item = function (kind, x) {
    var on = g[kind].some(function (y) { return y.id === x.id; });
    return '<label class="li' + (on ? ' on' : '') + '"><input type="checkbox" data-act="pickDetail" data-i="' + i + '" data-kind="' + kind + '" data-id="' + esc(x.id) +
      '" data-name="' + esc(x.name) + '"' + (on ? ' checked' : '') + dis(L) + '><div><div class="code">' + esc(x.name) + ' <span class="badge b-gray">' + size(x.size) +
      '</span></div><div class="desc">' + esc((x.path || []).slice(0, -1).join(' › ')) + '</div></div></label>';
  };
  var beh = (S.behaviors || []).filter(function (x) { return !bq || (x.name + ' ' + (x.path || []).join(' ')).toLowerCase().indexOf(bq) >= 0; }).slice(0, 80);
  return '<div style="margin-top:14px"><span class="lbl">Nhắm mục tiêu chi tiết: sở thích và hành vi (chọn nhiều)</span>' +
    '<div class="muted">Người xem cần có ÍT NHẤT MỘT sở thích/hành vi đã chọn. Nếu nhóm có cả tệp đối tượng, Meta chỉ nhắm phần GIAO nhau (tệp hẹp hơn).</div>' +
    (picked.length ? '<div class="chips" style="margin:8px 0">' + picked.map(function (pk) {
      return '<span class="chip on">' + (pk[0] === 'interests' ? '♥ ' : '◆ ') + esc(pk[1].name) + (L ? '' : ' <a data-act="unpickDetail" data-i="' + i + '" data-kind="' + pk[0] + '" data-id="' + esc(pk[1].id) + '" style="cursor:pointer;color:var(--badT)">✕</a>') + '</span>'; }).join('') + '</div>' : '') +
    (L ? '' : '<div class="grid2" style="margin-top:8px"><div><div class="bar"><input type="text" placeholder="Tìm sở thích, vd: mỹ phẩm, spa, kinh doanh online…" data-tq="' + kq + '" value="' + esc(S.open[kq] || '') +
      '"><button class="btn sm" data-act="searchInterest" data-i="' + i + '">Tìm</button></div><div class="list" style="margin-top:6px">' +
      (res.length ? res.map(function (x) { return item('interests', x); }).join('') : '<div class="li muted">Gõ từ khóa rồi bấm Tìm.</div>') + '</div></div>' +
      '<div><input type="text" placeholder="Lọc hành vi, vd: doanh nghiệp, du lịch…" data-search="tb_' + g.key + '" value="' + esc(S.open['tb_' + g.key] || '') + '">' +
      '<div class="list" style="margin-top:6px">' + (S.behaviors ? beh.map(function (x) { return item('behaviors', x); }).join('') :
        '<div class="li"><button class="btn sm" data-act="loadBehaviors">Tải danh sách hành vi</button></div>') + '</div></div></div>') +
    '<div class="note"><textarea placeholder="Ghi chú về sở thích/hành vi…" data-bind="adsets.' + i + '.detailNote"' + dis(L) + '>' + esc(g.detailNote || '') + '</textarea></div></div>';
}

function sectionAdsets(o, L) {
  var named = o.adsets.filter(function (g) { return g.name; });
  var b = '';
  o.adsets.forEach(function (g, i) {
    var p = 'adsets.' + i;
    var regs = g.regions.length ? g.regions.map(regionName).join(', ') : regionName(o.campaign.region) + ' (mặc định)';
    var sum = [g.audiences.length + ' tệp', g.excludes.length ? 'loại trừ ' + g.excludes.length : '', g.ageMin + '–' + g.ageMax,
               g.gender === 'all' ? 'Tất cả' : g.gender === 'male' ? 'Nam' : 'Nữ', regs, g.start ? 'từ ' + g.start.replace('T', ' ') : 'chưa có giờ bắt đầu',
               (g.interests || []).length + (g.behaviors || []).length ? ((g.interests || []).length + (g.behaviors || []).length) + ' sở thích/hành vi' : ''].filter(Boolean).join(' · ');
    var key = 'g_' + g.key;
    var open = S.open[key] !== undefined ? S.open[key] : true;
    var body = '<div class="row"><div class="fld"><label>Tên nhóm *</label><input type="text" data-bind="' + p + '.name" value="' + esc(g.name) + '"' + dis(L) + '></div></div>';
    body += '<div class="grid2" style="margin-top:12px"><div><span class="lbl">Tệp đối tượng (chọn nhiều)</span>' +
      audList(p + '.audiences', g.audiences, o.campaign.account, null, L, 'q_inc_' + g.key) +
      '<div class="note"><textarea placeholder="Ghi chú về tệp…" data-bind="' + p + '.audNote"' + dis(L) + '>' + esc(g.audNote) + '</textarea></div></div>' +
      '<div><span class="lbl">Tệp loại trừ (chọn nhiều)</span>' +
      audList(p + '.excludes', g.excludes, o.campaign.account, function (x) { return x.type !== 'Tương tự'; }, L, 'q_exc_' + g.key) +
      '<div class="note"><textarea placeholder="Ghi chú về loại trừ…" data-bind="' + p + '.excNote"' + dis(L) + '>' + esc(g.excNote) + '</textarea></div></div></div>';
    body += detailTargeting(g, i, L);
    body += '<div class="row"><div class="fld s"><label>Tuổi từ</label><input type="number" min="18" max="65" data-bind="' + p + '.ageMin" value="' + esc(g.ageMin) + '"' + dis(L) + '></div>' +
      '<div class="fld s"><label>Tuổi đến</label><input type="number" min="18" max="65" data-bind="' + p + '.ageMax" value="' + esc(g.ageMax) + '"' + dis(L) + '></div>' +
      '<div class="fld"><span class="lbl">Giới tính</span><div class="chips">' + [['all', 'Tất cả'], ['male', 'Nam'], ['female', 'Nữ']].map(function (x) {
        return chip(p + '.gender', x[0], x[1], g.gender === x[0], 'radio', L); }).join('') + '</div></div>' +
      '<div class="fld"><span class="lbl">Mở rộng của Meta</span><div class="chips">' +
      '<label class="chip' + (g.advantage ? ' on' : '') + '"><input type="checkbox" data-bool="' + p + '.advantage"' + (g.advantage ? ' checked' : '') + dis(L) + '>Advantage+ đối tượng</label>' +
      '</div></div></div>';
    body += '<div class="row"><div class="fld"><span class="lbl">Địa điểm (để trống = khu vực mặc định: ' + esc(regionName(o.campaign.region)) + ')</span><div class="chips">' +
      S.settings.regions.map(function (x) { return chip(p + '.regions', x.key, x.name, g.regions.indexOf(String(x.key)) >= 0, 'checkbox', L); }).join('') +

/* ================= Binding ================= */
function getPath(obj, path) { return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, obj); }
function setPath(obj, path, val) {
  var ks = path.split('.'), last = ks.pop();
  var t = ks.reduce(function (o, k) { return o[k]; }, obj); t[last] = val;
}
function numIf(path, v) { return /\.(ageMin|ageMax|dailyBudget)$/.test(path) ? (v === '' ? '' : Number(v)) : v; }

document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.dataset.bind && S.order) {
    setPath(S.order, el.dataset.bind, numIf(el.dataset.bind, el.value)); S.check = null; S.qc = null; S.dirty = true;
    if (el.dataset.counter) { var c = document.querySelector('[data-count="' + el.dataset.bind.replace(/\.message$/, '') + '"]'); if (c) c.textContent = el.value.length + ' ký tự'; }
  }
  if (el.dataset.search) { S.open[el.dataset.search] = el.value; var pos = el.selectionStart; render(); var n = document.querySelector('[data-search="' + el.dataset.search + '"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  if (el.dataset.ordq !== undefined) { S.ordQ = el.value; var p3 = el.selectionStart; render(); var o3 = document.querySelector('[data-ordq]'); o3.focus(); o3.setSelectionRange(p3, p3); }
  if (el.dataset.libq !== undefined) { S.libFilter.q = el.value; var p2 = el.selectionStart; render(); var m = document.querySelector('[data-libq]'); m.focus(); m.setSelectionRange(p2, p2); }
  if (el.dataset.logf !== undefined) S.logFilter = el.value;
  if (el.dataset.tq) S.open[el.dataset.tq] = el.value;
  if (el.dataset.set) { var v = el.type === 'number' ? Number(el.value) : el.value; setPath(S.settings, el.dataset.set, v); }
  if (el.dataset.setlist) S.settings[el.dataset.setlist] = el.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
});

document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset.libacc !== undefined) { S.libFilter.acc = el.value; return render(); }
  if (!S.order) return;
  if (el.dataset.radio) {
    setPath(S.order, el.dataset.radio, el.value);
    if (el.dataset.radio === 'campaign.account') S.order.adsets.forEach(function (g) { g.audiences = []; g.excludes = []; });
  } else if (el.dataset.bool) {
    setPath(S.order, el.dataset.bool, el.checked);
  } else if (el.dataset.multi) {
    var arr = getPath(S.order, el.dataset.multi);
    if (el.dataset.slot) {
      var pr = el.value.split('-').map(Number);
      var idx = arr.findIndex(function (x) { return x.from === pr[0] && x.to === pr[1]; });
      if (el.checked && idx < 0) arr.push({ from: pr[0], to: pr[1] }); if (!el.checked && idx >= 0) arr.splice(idx, 1);
    } else if (el.dataset.runall) {
      setPath(S.order, el.dataset.multi, el.checked ? ['all'] : []);
    } else {
      var val = el.dataset.num ? Number(el.value) : el.value;
      if (el.dataset.runone) arr = arr.filter(function (x) { return x !== 'all'; });
      var i = arr.indexOf(val);
      if (el.checked && i < 0) arr.push(val); if (!el.checked && i >= 0) arr.splice(i, 1);
      setPath(S.order, el.dataset.multi, arr);
    }
  } else return;
  S.check = null; S.dirty = true;
  var y = window.scrollY; render(); window.scrollTo(0, y);
});

/** Config validation + content QC together. */
function runChecks() {
  return Promise.all([call('validateOrder', { order: S.order }), call('qcPreview', { order: S.order })])
    .then(function (r) { S.check = r[0]; S.qc = r[1]; });
}

function qcDecide(approve) {
  var note = ($('#qc-note') || {}).value || '';
  if (!approve && !note.trim()) return toast('Ghi lý do trả về để người lên camp biết cần sửa gì.', true);
  if (approve && !confirm('Duyệt QC camp ' + S.order.id + '?')) return;
  call('qcDecide', { id: S.order.id, approve: approve, note: note }).then(function () {
    toast(approve ? 'Đã duyệt QC' : 'Đã trả về'); S.order = null; go('orders'); });
}

/** Saves are chained so a quick "Lưu" then "Hoàn thành" never creates two orders. */
function saveQueued() {
  S.pending = (S.pending || Promise.resolve()).catch(function () {}).then(function () {
    return call('saveOrder', { order: S.order }).then(function (o) {
      S.order.id = o.id; S.order.status = o.status; S.order.createdBy = o.createdBy; S.dirty = false; return o;
    });
  });
  return S.pending;
}

/** Reads the Telegram report form, saves it, keeps the screen in sync. */
function saveReportForm(quiet) {
  var adv;
  try { adv = JSON.parse($('#rep-json').value); } catch (x) { toast('JSON cấu hình báo cáo không hợp lệ', true); return Promise.reject(x); }
  var rep = Object.assign({}, adv, { chatId: $('#tg-chat').value.trim(), hour: Number($('#tg-hour').value), enabled: $('#tg-on').checked });
  return call('saveReport', { report: rep }).then(function (d) {
    S.rep = d; toast(quiet ? 'Đã chọn nhóm và lưu' : 'Đã lưu cấu hình báo cáo');
    var y = window.scrollY; render(); window.scrollTo(0, y); return d;
  });
}

function setAll(v) {
  ['cd', 'nqc', 'qc', 'rv'].forEach(function (k) { S.open[k] = v; });
  S.order.adsets.forEach(function (g) { S.open['g_' + g.key] = v; });
  S.order.ads.forEach(function (x) { S.open['a_' + x.key] = v; });
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'lg-pin') document.querySelector('[data-act="login"]').click();
  if (e.key === 'Enter' && e.target.dataset.tq) { e.preventDefault(); var btn = e.target.parentNode.querySelector('[data-act="searchInterest"]'); if (btn) btn.click(); }
});
window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
boot();
</script>
