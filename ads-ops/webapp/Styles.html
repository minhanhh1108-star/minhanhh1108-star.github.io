<style>
  :root {
    --blue:#1d4ed8; --blue2:#3b82f6; --navy:#0f2742; --navy2:#16365a; --green:#15803d; --orange:#c2410c; --red:#b91c1c; --gray:#64748b;
    --bg:#f4f6fa; --card:#fff; --line:#e6e9ef; --ink:#0f172a; --ink2:#334155;
    --ok:#e7f6ec; --okT:#166534; --bad:#fdecec; --badT:#b42318; --warn:#fff5e6; --warnT:#9a5b00; --info:#eaf1ff;
    --r:12px; --shadow:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--ink); font-size:14px; -webkit-font-smoothing:antialiased; }
  a { color:var(--blue); }

  /* ---------- Shell: sidebar + main ---------- */
  .shell { display:flex; min-height:100vh; }
  aside.side { width:236px; flex:0 0 236px; background:var(--navy); color:#cbd5e1; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .brand { display:flex; align-items:center; gap:10px; padding:18px 18px 14px; color:#fff; font-weight:700; font-size:16px; letter-spacing:.2px; }
  .brand .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#3b82f6,#22c55e); display:grid; place-items:center; font-size:15px; }
  .brand small { display:block; font-weight:500; font-size:11px; color:#94a3b8; letter-spacing:0; }
  nav.menu { flex:1; overflow:auto; padding:4px 10px; }
  .grp { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#64748b; padding:14px 10px 6px; font-weight:600; }
  nav.menu button { display:flex; align-items:center; gap:10px; width:100%; background:transparent; color:#cbd5e1; border:0; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:14px; text-align:left; font-family:inherit; }
  nav.menu button svg { width:17px; height:17px; flex:0 0 17px; opacity:.8; }
  nav.menu button:hover { background:rgba(255,255,255,.06); color:#fff; }
  nav.menu button.active { background:var(--navy2); color:#fff; box-shadow:inset 3px 0 0 var(--blue2); }
  nav.menu button.cta { background:var(--blue); color:#fff; margin:2px 0 4px; }
  nav.menu button.cta:hover { background:#1e40af; }
  .cnt { margin-left:auto; background:#f59e0b; color:#111; font-size:11px; font-weight:700; border-radius:10px; padding:1px 7px; }
  .who { border-top:1px solid rgba(255,255,255,.08); padding:12px 12px 14px; font-size:12px; }
  .who .me { display:flex; gap:10px; align-items:center; }
  .who .rl { color:#94a3b8; font-size:12px; }
  .who .acts { display:flex; gap:6px; margin-top:10px; }
  .who .acts button { flex:1; background:rgba(255,255,255,.07); color:#e2e8f0; border:1px solid rgba(255,255,255,.12); border-radius:7px; padding:6px 4px; font-size:12px; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .who .acts button:hover { background:rgba(255,255,255,.16); color:#fff; }
  .ava { width:32px; height:32px; border-radius:50%; background:#334e6e; color:#fff; display:grid; place-items:center; font-weight:700; flex:0 0 32px; }
  .who .nm { color:#fff; font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
  .who a { color:#94a3b8; cursor:pointer; text-decoration:none; } .who a:hover { color:#fff; }
  main { flex:1; min-width:0; padding:22px 28px 40px; max-width:1400px; }

  /* ---------- Page header ---------- */
  .ph { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .ph h2 { margin:0; }
  .ph .sub2 { color:var(--gray); font-size:13px; margin-top:4px; }
  h2 { font-size:21px; font-weight:700; margin:4px 0 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; letter-spacing:-.2px; }
  .muted { color:var(--gray); font-size:12px; }

  /* ---------- KPI tiles ---------- */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; box-shadow:var(--shadow); }
  .kpi .k { color:var(--gray); font-size:12px; font-weight:500; }
  .kpi .v { font-size:22px; font-weight:700; margin-top:4px; letter-spacing:-.3px; }
  .kpi .v.bad { color:var(--badT); } .kpi .v.ok { color:var(--okT); }
  .kpi .h { font-size:12px; color:var(--gray); margin-top:2px; }

  /* ---------- Filters / segmented ---------- */
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .seg { display:inline-flex; background:#e9edf3; border-radius:9px; padding:3px; gap:2px; flex-wrap:wrap; }
  .seg button { border:0; background:transparent; padding:6px 12px; border-radius:7px; cursor:pointer; font-size:13px; color:var(--ink2); font-family:inherit; white-space:nowrap; }
  .seg button.on { background:#fff; color:var(--ink); font-weight:600; box-shadow:var(--shadow); }
  .seg button .c { color:var(--gray); font-weight:500; margin-left:4px; }

  /* ---------- Cards ---------- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin-bottom:14px; box-shadow:var(--shadow); }
  .card > .hd { display:flex; align-items:center; gap:10px; padding:13px 16px; cursor:pointer; }
  .card > .hd .ttl { font-weight:600; font-size:15px; }
  .card > .hd .sum { color:var(--gray); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card > .bd { padding:6px 16px 16px; border-top:1px solid var(--line); }
  .sec { border-left:4px solid var(--blue); scroll-margin-top:70px; }
  .sec.g { border-left-color:var(--blue2); } .sec.a { border-left-color:var(--green); } .sec.r { border-left-color:var(--orange); }
  .sub { border:1px solid var(--line); border-radius:10px; margin:10px 0; background:#fafbfd; }
  .sub > .hd { padding:10px 12px; }

  /* ---------- Editor stepper + sticky action bar ---------- */
  .steps { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px; }
  .step { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:6px 12px 6px 6px; cursor:pointer; font-size:13px; color:var(--ink2); }
  .step .n { width:22px; height:22px; border-radius:50%; background:#e2e8f0; display:grid; place-items:center; font-size:12px; font-weight:700; }
  .step.ok .n { background:var(--ok); color:var(--okT); } .step.err .n { background:var(--bad); color:var(--badT); }
  .step:hover { border-color:#cbd5e1; }
  .actbar { position:sticky; bottom:0; z-index:15; background:rgba(255,255,255,.96); backdrop-filter:blur(6px); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 -4px 16px rgba(15,23,42,.08); padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .actbar .info { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--ink2); }
  .actbar .info b { color:var(--ink); }

  /* ---------- Forms ---------- */
  .row { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; }
  .fld { display:flex; flex-direction:column; gap:5px; min-width:180px; flex:1; }
  .fld.s { flex:0 0 120px; min-width:120px; }
  .fld > label, .lbl { font-weight:600; font-size:13px; color:var(--ink2); }
  input[type=text], input[type=number], input[type=email], input[type=password], input[type=datetime-local], select, textarea {
    border:1px solid #cfd6e0; border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; width:100%; background:#fff; color:var(--ink); transition:border-color .12s, box-shadow .12s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--blue2); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  textarea { min-height:70px; resize:vertical; }
  input:disabled, textarea:disabled { background:#f3f5f8; color:#6b7280; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid #cfd6e0; border-radius:16px; padding:5px 11px; cursor:pointer; background:#fff; user-select:none; font-size:13px; }
  .chip input { margin:0; }
  .chip.on { background:var(--info); border-color:var(--blue2); color:var(--blue); font-weight:600; }
  .chip.dis { opacity:.55; cursor:not-allowed; }
  .list { max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .li { display:flex; gap:8px; align-items:flex-start; padding:7px 10px; border-bottom:1px solid #f1f5f9; cursor:pointer; }
  .li:last-child { border-bottom:0; } .li:hover { background:#f8fafc; } .li.on { background:#eef5ff; }
  .li .code { font-weight:600; font-size:13px; } .li .desc { color:var(--gray); font-size:12px; }

  /* ---------- Badges / buttons ---------- */
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .b-ok { background:var(--ok); color:var(--okT); } .b-bad { background:var(--bad); color:var(--badT); }
  .b-warn { background:var(--warn); color:var(--warnT); } .b-info { background:var(--info); color:var(--blue); } .b-gray { background:#eef2f6; color:#475569; }
  .btn { border:1px solid #cfd6e0; background:#fff; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:13px; white-space:nowrap; font-family:inherit; color:var(--ink); font-weight:500; }
  .btn:hover { background:#f6f8fb; }
  .btn.p { background:var(--blue); border-color:var(--blue); color:#fff; } .btn.p:hover { background:#1e40af; }
  .btn.go { background:var(--green); border-color:var(--green); color:#fff; } .btn.go:hover { background:#166534; }
  .btn.danger { color:var(--badT); border-color:#f3c0c0; } .btn.danger:hover { background:var(--bad); }
  .btn.ghost { border-color:transparent; background:transparent; color:var(--ink2); } .btn.ghost:hover { background:#eef2f6; }
  .btn.sm { padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .right { margin-left:auto; }

  /* ---------- Tables ---------- */
  table { width:100%; border-collapse:collapse; background:#fff; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; font-size:13px; }
  th { background:#f8fafc; font-size:12px; color:#475569; font-weight:600; position:sticky; top:0; z-index:1; white-space:nowrap; }
  tr:hover td { background:#fafcff; }
  td.n, th.n { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  td.nw { white-space:nowrap; }
  .tbl { border:1px solid var(--line); border-radius:var(--r); overflow:auto; max-height:72vh; background:#fff; box-shadow:var(--shadow); }
  .empty { text-align:center; padding:40px 20px; color:var(--gray); background:#fff; border:1px dashed #cfd6e0; border-radius:var(--r); }
  .empty b { display:block; color:var(--ink); font-size:15px; margin-bottom:6px; }
  .tree td:first-child { min-width:240px; max-width:380px; } .tree td:last-child { width:1%; }
  .lvl1 td { font-weight:600; } .lvl2 td { background:#f8fafc; } .lvl2 td:first-child { padding-left:30px; } .lvl3 td { background:#fcfdfe; } .lvl3 td:first-child { padding-left:54px; color:#374151; }

  /* ---------- Messages ---------- */
  .msgs { margin:8px 0 0; padding:0; list-style:none; }
  .msgs li { padding:8px 11px; border-radius:8px; margin-bottom:6px; font-size:13px; line-height:1.45; }
  .msgs .e { background:var(--bad); color:var(--badT); } .msgs .w { background:var(--warn); color:var(--warnT); }
  .note { margin-top:6px; } .note textarea { min-height:38px; }
  .preview { background:#f8fafc; border:1px dashed #cfd6e0; border-radius:8px; padding:8px; font-size:12px; color:#374151; }
  .stat { display:flex; gap:22px; flex-wrap:wrap; margin:10px 0 2px; }
  .stat div b { display:block; font-size:18px; }

  /* ---------- Login ---------- */
  .center { display:flex; justify-content:center; align-items:center; min-height:90vh; }
  .login { width:380px; max-width:92vw; }
  .login .brand { color:var(--ink); padding:0 0 6px; font-size:20px; }
  .login .brand small { color:var(--gray); font-size:12px; }

  .toast { position:fixed; bottom:22px; right:22px; background:#0f172a; color:#fff; padding:11px 16px; border-radius:10px; z-index:99; max-width:min(440px,90vw); box-shadow:0 8px 24px rgba(15,23,42,.25); font-size:13px; }
  .toast.err { background:var(--badT); }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid #cbd5e1; border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .caret { transition:transform .15s; color:var(--gray); } .collapsed .caret { transform:rotate(-90deg); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .modal-bg { position:fixed; inset:0; background:rgba(15,23,42,.45); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal { background:#fff; border-radius:12px; padding:18px; width:460px; max-width:92vw; }
  svg.chart { width:100%; height:auto; display:block; font-family:inherit; }
  .cwrap { overflow-x:auto; } .cwrap svg.chart { min-width:760px; }
  .docs { display:grid; grid-template-columns:300px 1fr; gap:14px; align-items:start; }
  .doclist { display:flex; flex-direction:column; gap:8px; max-height:78vh; overflow:auto; }
  .docitem { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; font-size:13px; }
  .docitem:hover { border-color:#cbd5e1; } .docitem.on { border-color:var(--blue2); box-shadow:0 0 0 3px rgba(59,130,246,.12); }
  .md { font-size:14px; line-height:1.65; color:var(--ink); }
  .md h2 { font-size:20px; margin:18px 0 8px; } .md h3 { font-size:17px; margin:16px 0 6px; } .md h4, .md h5 { font-size:15px; margin:14px 0 4px; }
  .md p { margin:8px 0; } .md ul, .md ol { margin:6px 0 6px 22px; padding:0; } .md li { margin:3px 0; }
  .md code { background:#f1f5f9; padding:1px 5px; border-radius:4px; font-size:12.5px; } .md pre { background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px; overflow:auto; font-size:12.5px; }
  .md blockquote { margin:8px 0; padding:8px 12px; border-left:3px solid var(--blue2); background:var(--info); border-radius:0 8px 8px 0; }
  .md hr { border:0; border-top:1px solid var(--line); margin:14px 0; }
  @media (max-width: 900px) { .docs { grid-template-columns:1fr; } .doclist { max-height:none; } }
  .stab { display:none; } .stab.on { display:block; }

  /* ---------- Mobile ---------- */
  @media (max-width: 900px) {
    .shell { display:block; }
    aside.side { position:sticky; top:0; z-index:30; width:auto; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; }
    .brand { padding:10px 14px; font-size:15px; } .brand small { display:none; }
    .who { border:0; padding:6px 10px; margin-left:auto; display:flex; gap:8px; align-items:center; } .who .me div, .who .nm, .who .rl { display:none; } .who .acts { margin-top:0; } .who .acts button { flex:0 0 auto; padding:5px 8px; }
    nav.menu { order:3; flex:0 0 100%; display:flex; gap:4px; overflow-x:auto; padding:0 10px 8px; scrollbar-width:none; }
    nav.menu::-webkit-scrollbar { display:none; }
    .grp { display:none; }
    nav.menu button { width:auto; white-space:nowrap; padding:7px 11px; }
    nav.menu button svg { display:none; }
    nav.menu button.active { box-shadow:none; }
    main { padding:14px 12px 30px; }
    h2 { font-size:18px; }
    .grid2 { grid-template-columns:1fr; }
    .kpis { grid-template-columns:repeat(2,1fr); }
    .kpi .v { font-size:18px; }
    .toast { left:12px; right:12px; bottom:12px; }
  }
</style>
