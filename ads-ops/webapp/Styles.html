<style>
  :root { --blue:#1f4e79; --blue2:#2e75b6; --green:#548235; --orange:#c55a11; --red:#c00000; --gray:#6b7280;
          --bg:#f4f6fb; --card:#fff; --line:#e5e7eb; --ok:#e6f4ea; --okT:#137333; --bad:#fde8e8; --badT:#b42318; --warn:#fff4e5; --warnT:#9a5b00; }

</style>
